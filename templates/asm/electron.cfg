# ld65-configuratie voor een programma in machinecode voor de Acorn Electron.
# Het programma wordt geladen en gestart op het adres dat ld65 met -S krijgt
# (&0E00, PAGE). Het moet eindigen voor het schermgeheugen: &3000 in MODE 0-2.
# Zero page &70-&8F is vrij voor eigen gebruik.
MEMORY {
    ZP:   start = $0070, size = $0020, type = rw, define = yes;
    MAIN: start = %S,    size = $3000 - %S, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = ro,  optional = yes;
    DATA:     load = MAIN, type = rw,  optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes, define = yes;
}
